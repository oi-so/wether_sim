[project]
name = "weather-sim"
version = "0.1.0"
description = "WRF-based local weather simulation and observation verification tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "netcdf4>=1.7",
  "numpy>=2.0,<2.5",
  "pandas>=2.2",
  "pillow>=10.4",
  "pyyaml>=6.0",
  "xarray>=2024.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
weather-sim = "weather_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_sim"]
